name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          REQUIRE_NODE: "1"

      - name: Build
        run: |
          go build -tags=ts_omit_logtail -trimpath -ldflags="-s -w" -o PortableTailscale.exe .
          go build -trimpath -ldflags="-s -w" -o PortableTailscaleRDP.exe ./cmd/tui

      - name: Smoke test
        run: .\PortableTailscaleRDP.exe --smoke-test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PortableTailscale-windows-amd64
          path: |
            PortableTailscale.exe
            PortableTailscaleRDP.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PortableTailscale-windows-amd64
          path: dist

      - run: gh release create "$GITHUB_REF_NAME" dist/*.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
