name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          REQUIRE_NODE: "1"

      - name: Build
        run: |
          go build -tags=ts_omit_logtail -trimpath -ldflags="-s -w" -o PortableTailscale.exe ./cmd/portabletailscale
          go build -trimpath -ldflags="-s -w" -o PortableTailscaleRDP.exe ./cmd/tui

      - name: Smoke test
        run: .\PortableTailscaleRDP.exe --smoke-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PortableTailscale-windows-amd64
          path: |
            PortableTailscale.exe
            PortableTailscaleRDP.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PortableTailscale-windows-amd64
          path: dist

      - run: gh release create "$GITHUB_REF_NAME" dist/*.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
