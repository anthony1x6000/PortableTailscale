name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          REQUIRE_NODE: "1"

      - name: Build
        run: |
          $ver = if ("${env:GITHUB_REF_TYPE}" -eq "tag") { "${env:GITHUB_REF_NAME}" } else { ${env:GITHUB_SHA}.Substring(0, 7) }
          # ldflags through a variable: passing an inline quoted expression to a
          # native command loses the -X assignment under pwsh's re-quoting.
          $ld = "-s -w -X portabletailscale/cmd/portabletailscale.version=$ver"
          go build -tags=ts_omit_logtail -trimpath -ldflags $ld -o PortableTailscale.exe ./cmd/portabletailscale
          go build -trimpath -ldflags="-s -w" -o PortableTailscaleRDP.exe ./cmd/tui
          go build -trimpath -ldflags="-s -w" -o pt-e2e-harness.exe ./test/harness
          $stamp = (& .\PortableTailscale.exe --version).Trim()
          if ($stamp -ne $ver) { throw "version stamp mismatch: exe reports '$stamp', expected '$ver'" }
          Write-Host "version stamp OK: $stamp"

      # Runs PR-modifiable code with runner-level rights (local account,
      # process creation). Safe only because windows-latest is an ephemeral
      # GitHub-hosted runner; do not move this job to self-hosted runners or
      # pull_request_target. The login is against a local fake control
      # server (test/harness); no secrets are involved.
      - name: No-admin e2e test
        shell: pwsh
        run: ./test/no-admin/no-admin.e2e.ps1 -ExePath ./PortableTailscale.exe -HarnessPath ./pt-e2e-harness.exe

      - name: Smoke test
        run: .\PortableTailscaleRDP.exe --smoke-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PortableTailscale-windows-amd64
          path: |
            PortableTailscale.exe
            PortableTailscaleRDP.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PortableTailscale-windows-amd64
          path: dist

      - run: gh release create "$GITHUB_REF_NAME" dist/*.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
