name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # cmd/tui is Windows-only, so this job covers the main binary; the
      # Windows workflow runs ./... for everything.
      - run: go vet ./cmd/portabletailscale
      - run: go test -race ./cmd/portabletailscale
        env:
          REQUIRE_NODE: "1"
      - run: go test -run=^$ -fuzz=FuzzSplitTarget -fuzztime=5s ./cmd/portabletailscale
      - run: go test -run=^$ -fuzz=FuzzApplySSHBlock -fuzztime=5s ./cmd/portabletailscale

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # The Playwright harness lives in test/ next to browser.mjs.
      - run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
        working-directory: test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: BROWSER_TEST=1 REQUIRE_NODE=1 xvfb-run -a go test -run TestChromiumBrowser -v ./cmd/portabletailscale
