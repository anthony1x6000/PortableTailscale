name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # cmd/tui is Windows-only, so this job covers the main binary; the
      # Windows workflow runs ./... for everything.
      - run: go vet ./cmd/portabletailscale
      - run: go test -race ./cmd/portabletailscale
        env:
          REQUIRE_NODE: "1"
      - run: go test -run=^$ -fuzz=FuzzSplitTarget -fuzztime=5s ./cmd/portabletailscale
      - run: go test -run=^$ -fuzz=FuzzApplySSHBlock -fuzztime=5s ./cmd/portabletailscale

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # The Playwright harness lives in test/ next to browser.mjs.
      - run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
        working-directory: test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npx playwright install --with-deps chromium
        working-directory: test
      - run: BROWSER_TEST=1 REQUIRE_NODE=1 xvfb-run -a go test -run TestChromiumBrowser -v ./cmd/portabletailscale
